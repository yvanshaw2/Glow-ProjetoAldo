openapi: 3.1.0
info:
  title: Glow – Estética Automotiva API
  version: 0.1.0
  description: >-
    API interna do Glow, servida pelas rotas do Next.js sob /api, no mesmo
    domínio das páginas (docs/padroes/api.md). Não tem versão no caminho
    (decisão 0026); o campo version acompanha o package.json só porque é
    obrigatório. Toda resposta de erro é Problem Details (RFC 9457, decisão
    0025), e nenhuma resposta vai para cache (Cache-Control: no-store). Toda
    gravação (POST, PUT, PATCH e DELETE) exige o cabeçalho Origin com o host
    da própria requisição; com corpo, só application/json, até 100 KB.
    Rotas e regras de cada assunto: docs/<assunto>/rotas.md.
servers:
  - url: /
tags:
  - name: auth
    description: >-
      Cadastro de cliente, login único de clientes e funcionários, sessão,
      logout e troca de senha (docs/acesso/rotas.md,
      docs/acesso/autenticacao.md).
  - name: public
    description: >-
      Dados da empresa e catálogo, sem autenticação
      (docs/configuracoes/rotas.md, docs/catalogo/rotas.md).
  - name: settings
    description: >-
      Configurações do painel: dados da empresa, disponibilidade e formas de
      pagamento, com a permissão settings (docs/configuracoes/rotas.md).
  - name: catalog
    description: >-
      Serviços e categorias do painel, com a permissão services
      (docs/catalogo/rotas.md).
  - name: staff
    description: >-
      Cargos e permissões do painel, com a permissão staff
      (docs/equipe/rotas.md).
  - name: clients
    description: >-
      Clientes do painel, com a permissão clients (docs/clientes/rotas.md).
  - name: client-area
    description: >-
      Conta, veículos e agendamento do cliente, só sobre os dados do cliente da
      sessão (docs/clientes/rotas.md, docs/agendamento/rotas.md).
  - name: appointments
    description: >-
      Agendamentos do painel, com a permissão appointments
      (docs/agendamento/rotas.md).
  - name: dashboard
    description: >-
      Indicadores e agenda do dia do painel, com a permissão dashboard
      (docs/agendamento/rotas.md).
paths:
  /api/auth/register:
    post:
      tags:
        - auth
      operationId: register
      summary: Cria a conta de cliente
      description: >-
        Cadastro pelo portal (UC02). Cria a conta no Supabase Auth, com o
        e-mail já confirmado, e o cliente em clients; se a gravação do cliente
        falhar, a conta recém-criada é removida. Não inicia sessão nem altera
        a que existir: a interface leva ao login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Conta criada, com os dados gravados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredClient"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "409":
          description: >-
            EMAIL_IN_USE: o e-mail já tem conta, de cliente ou de funcionário
            (RN022).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/auth/login:
    post:
      tags:
        - auth
      operationId: login
      summary: Inicia a sessão de cliente ou de funcionário
      description: >-
        Login único (UC03, UC08, RN029). Valida o e-mail e a senha no
        Supabase Auth e grava a sessão em cookies. Cinco falhas seguidas para
        o mesmo e-mail bloqueiam o login por 15 minutos (RS006). Com a senha
        certa, a conta desativada recebe 403, e a conta excluída ou sem perfil
        recebe o mesmo 401 do e-mail inexistente (RS005).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Sessão iniciada.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: >-
            INVALID_CREDENTIALS: e-mail inexistente, senha errada ou conta sem
            perfil, sempre com a mesma mensagem (RS005).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: >-
            ACCOUNT_INACTIVE: funcionário desativado, com a senha certa
            (RN026); nenhum cookie de sessão é gravado. FORBIDDEN: origem
            recusada (RS014).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          description: >-
            ACCOUNT_LOCKED: e-mail bloqueado por excesso de tentativas, mesmo
            com a senha certa (RS006).
          headers:
            Retry-After:
              description: Segundos até o fim do bloqueio.
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/auth/logout:
    post:
      tags:
        - auth
      operationId: logout
      summary: Encerra a sessão deste navegador
      description: >-
        Encerra no Supabase Auth a sessão deste navegador, sem afetar as de
        outros aparelhos, e apaga os cookies (RS007). Não exige sessão: sem
        ela, com a conta desativada ou com a senha inicial pendente, responde
        204 do mesmo jeito. Sem corpo.
      security: []
      responses:
        "204":
          description: Sessão encerrada, ou nenhuma sessão a encerrar.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/auth/me:
    get:
      tags:
        - auth
      operationId: getSessionUser
      summary: Devolve o usuário da sessão e suas permissões
      description: >-
        Perfil, situação e permissões lidos do banco nesta requisição (RS011).
        Aceita a senha inicial pendente, informada em mustChangePassword
        (RS004).
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Usuário da sessão.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: >-
            UNAUTHENTICATED: sem sessão, sessão expirada ou encerrada, ou conta
            excluída ou sem perfil.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: "ACCOUNT_INACTIVE: funcionário desativado (RN026)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/auth/change-password:
    post:
      tags:
        - auth
      operationId: changePassword
      summary: Troca a senha, inclusive a inicial no primeiro acesso
      description: >-
        Confere a senha atual, que no primeiro acesso é a inicial, por uma
        nova entrada no Supabase Auth e grava a nova senha (UC03, UC04, UC08,
        RN023, RS004, decisão 0048). Aceita a senha inicial pendente e remove
        a marca de troca. A sessão deste navegador continua, renovada nos
        cookies, e as de outros aparelhos são encerradas. As senhas atuais
        erradas contam no mesmo bloqueio do login (RS006).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "204":
          description: Senha alterada e marca de troca pendente removida.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
        "400":
          description: >-
            VALIDATION_ERROR: nova senha igual à atual ou fora do formato de
            RS003, com a mensagem em fields; ou corpo que não é JSON válido,
            sem fields.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: >-
            INVALID_CURRENT_PASSWORD: senha atual incorreta; a sessão continua.
            UNAUTHENTICATED: sem sessão, sessão expirada ou encerrada, ou conta
            excluída ou sem perfil.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: >-
            ACCOUNT_INACTIVE: funcionário desativado (RN026). FORBIDDEN: origem
            recusada (RS014).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          description: >-
            ACCOUNT_LOCKED: e-mail da conta bloqueado por excesso de senhas
            erradas, no login ou na troca de senha (RS006).
          headers:
            Retry-After:
              description: Segundos até o fim do bloqueio.
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/public/categories:
    get:
      tags:
        - public
      operationId: listPublicCategories
      summary: Lista as categorias do filtro do catálogo
      description: >-
        As categorias ativas com ao menos um serviço principal ou complementar
        ativo e não excluído (UC01, RN008, RN031), por nome e sem paginação,
        porque o filtro precisa delas inteiras.
      security: []
      responses:
        "200":
          description: Categorias do filtro.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicCategory"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/services:
    get:
      tags:
        - public
      operationId: listPublicServices
      summary: Lista os serviços do catálogo público
      description: >-
        Serviços principais e complementares ativos, de categorias ativas e
        não excluídos (UC01, RN008, RN031, RN030), por nome, 12 por página. Com
        categoryId, só os da categoria; categoria inexistente, inativa ou sem
        serviço ativo devolve a página vazia.
      security: []
      parameters:
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: Até 50; acima disso vale 50.
          schema:
            type: integer
            minimum: 1
            default: 12
      responses:
        "200":
          description: Página de serviços.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicServicePage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/company:
    get:
      tags:
        - public
      operationId: getPublicCompany
      summary: Devolve os dados institucionais e a disponibilidade
      description: >-
        Dados exibidos no rodapé e na página inicial do portal (RN028, RF004)
        e a disponibilidade dos sete dias da semana. O CNPJ não é público. O
        dado opcional vazio vem como null.
      security: []
      responses:
        "200":
          description: Dados da empresa e disponibilidade.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCompany"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/settings/company:
    get:
      tags:
        - settings
      operationId: getCompanySettings
      summary: Devolve os dados da empresa para edição
      description: >-
        Dados da empresa (UC22), com o updatedAt que o PUT devolve (RNF011).
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Dados da empresa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanySettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - settings
      operationId: updateCompanySettings
      summary: Grava os dados da empresa
      description: >-
        Substitui os dados da empresa (UC22), com os formatos de RN035. O dado
        opcional ausente, null ou vazio apaga o valor gravado. A gravação só
        acontece se o registro ainda tiver o updatedAt enviado, conferido na
        própria instrução (RNF011, decisão 0009).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanySettingsInput"
      responses:
        "200":
          description: Dados gravados, já normalizados, com o novo updatedAt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanySettings"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/settings/business-hours:
    get:
      tags:
        - settings
      operationId: getBusinessHours
      summary: Devolve a disponibilidade da empresa
      description: Os sete dias da semana, de domingo (0) a sábado (6) (UC23).
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Os sete dias, com situação, horários e pausa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessHours"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - settings
      operationId: updateBusinessHours
      summary: Grava a disponibilidade da empresa
      description: >-
        Substitui os sete dias numa só instrução (UC23, RN013), com os horários
        em hora cheia ou meia hora (RN035). Não tem updatedAt: a última
        gravação prevalece. O campo com problema vai em fields com o índice do
        item (1.closesAt); a lista sem os sete dias, uma só vez cada, é erro do
        corpo.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessHours"
      responses:
        "200":
          description: Os sete dias gravados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessHours"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/settings/payment-fees:
    get:
      tags:
        - settings
      operationId: getPaymentFees
      summary: Devolve os percentuais das formas de pagamento
      description: Crédito, débito, Pix e dinheiro, nessa ordem (UC24).
      security:
        - sessionCookie: []
      responses:
        "200":
          description: As quatro formas, com o percentual com sinal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentFees"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - settings
      operationId: updatePaymentFees
      summary: Grava os percentuais das formas de pagamento
      description: >-
        Substitui as quatro formas numa só instrução (UC24, RN012); o desconto
        é negativo. Não tem updatedAt: a última gravação prevalece. O campo com
        problema vai em fields com o índice do item (2.percent); a lista sem as
        quatro formas, uma só vez cada, é erro do corpo.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentFees"
      responses:
        "200":
          description: As quatro formas gravadas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentFees"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/services/image:
    post:
      tags:
        - catalog
      operationId: uploadServiceImage
      summary: Envia a imagem de um serviço
      description: >-
        Grava a imagem no bucket service-images (UC13 passo 4, UC14). O tipo
        (JPEG, PNG ou WebP) vem do conteúdo do arquivo, e o tamanho vai até 2
        MB; o nome é gerado pelo servidor (RS015). O imagePath devolvido entra
        no cadastro ou na edição do serviço.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Imagem gravada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceImage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/categories:
    get:
      tags:
        - catalog
      operationId: listCategories
      summary: Lista as categorias de serviço
      description: >-
        Categorias por nome, 20 por página (UC15, RNF008). As inativas só com
        includeInactive=true (FA03).
      security:
        - sessionCookie: []
      parameters:
        - name: includeInactive
          in: query
          schema:
            type: string
            enum:
              - "true"
              - "false"
            default: "false"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: Até 50; acima disso vale 50.
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: Página de categorias.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - catalog
      operationId: createCategory
      summary: Cadastra uma categoria
      description: >-
        Cadastra a categoria, sempre ativa (UC15), com os formatos de RN035. O
        nome não se repete, sem diferenciar maiúsculas.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Categoria criada e ativa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategory"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "409":
          $ref: "#/components/responses/NameInUse"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/categories/{id}:
    patch:
      tags:
        - catalog
      operationId: updateCategory
      summary: Edita, desativa ou reativa uma categoria
      description: >-
        Altera só os campos enviados, ao menos um (UC15 FA01 e FA02). A
        gravação só acontece se a categoria ainda tiver o updatedAt enviado,
        conferido na própria instrução (RNF011, decisão 0009). Id que não é
        UUID responde o mesmo 404 da categoria inexistente.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdateInput"
      responses:
        "200":
          description: Categoria atualizada, com o novo updatedAt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategory"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            NAME_IN_USE: o nome já é de outra categoria (RN035).
            VERSION_CONFLICT: a categoria mudou depois da leitura, e nada foi
            gravado (RNF011).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/services:
    get:
      tags:
        - catalog
      operationId: listServices
      summary: Lista os serviços
      description: >-
        Serviços por nome, 20 por página (UC14, RNF008), sem os excluídos
        (RN030). Os inativos só com includeInactive=true (FA01). O serviço de
        categoria inativa consta na lista, com isCategoryActive falso (RN031).
