        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags:
        - catalog
      operationId: updateService
      summary: Edita, desativa ou reativa um serviço
      description: >-
        Altera só os campos enviados, ao menos um (UC14 FA01 a FA03). O
        resultado é validado como um cadastro do tipo do serviço, que não muda;
        trocar pricingMode exige os valores da nova forma e descarta os da
        antiga. A gravação só acontece se o serviço ainda tiver o updatedAt
        enviado (RNF011, decisão 0009). Id que não é UUID responde o mesmo 404
        do serviço inexistente.
