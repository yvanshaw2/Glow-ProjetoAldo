          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentRescheduleInput"
      responses:
        "201":
          description: Novo agendamento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAppointment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidStatus"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/appointments/lookup/clients:
    get:
      tags:
        - appointments
      operationId: lookUpAppointmentClients
      summary: Busca clientes para o novo agendamento
      description: >-
        Clientes ativos, em ordem alfabética do nome, 10 por página (UC11
        passo 2, RN030). O termo se separa em palavras, e cada uma precisa
        aparecer, sem diferenciar maiúsculas, no nome, no sobrenome ou no
        e-mail; o telefone não entra na busca.
      security:
        - sessionCookie: []
      parameters:
        - name: search
          in: query
          required: true
          description: Até 100 caracteres; vazio responde 400.
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: Até 50; acima disso vale 50.
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        "200":
          description: Página de clientes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminClientOptionPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/appointments/lookup/vehicles:
    get:
      tags:
        - appointments
      operationId: lookUpAppointmentVehicles
      summary: Lista os veículos do cliente escolhido
      description: >-
        Os veículos da conta do cliente, na ordem em que foram vinculados, 10
        por página (UC11 passo 3, RN003).
      security:
        - sessionCookie: []
      parameters:
        - name: clientId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: Até 50; acima disso vale 50.
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        "200":
          description: Página de veículos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientVehiclePage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/appointments/lookup/services:
    get:
      tags:
        - appointments
      operationId: lookUpAppointmentServices
      summary: Lista os serviços para agendar, com o preço do porte do veículo
      description: >-
        Serviços principais e complementares ativos, não excluídos e de
        categoria ativa, por nome, 12 por página, com o preço do porte do
        veículo ou o fixo e, no principal, os adicionais ativos vinculados
        (UC11 passo 4, RN006, RN008, RN009, RN031).
      security:
        - sessionCookie: []
      parameters:
        - name: vehicleId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: Até 50; acima disso vale 50.
          schema:
            type: integer
            minimum: 1
            default: 12
      responses:
        "200":
          description: Página de serviços.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookableServicePage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/appointments/preview:
    post:
      tags:
        - appointments
      operationId: previewAdminAppointment
      summary: Calcula os valores de um agendamento, sem gravar
      description: >-
        Pelo catálogo vigente: os serviços que podem ser agendados ficam, os
        outros saem. A data, o horário e a composição só são conferidos no
        registro e, na edição, no PATCH. appointmentId identifica a edição e não
        muda o cálculo (UC11
        passo 6, RN010, RN012, RN014, RN034).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentPreviewInput"
      responses:
        "200":
          description: Valores calculados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentPreview"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/dashboard:
    get:
      tags:
        - dashboard
      operationId: getDashboard
      summary: Indicadores do período e agenda do dia
      description: >-
        Receita, quantidade de agendamentos, ticket médio e taxa de
        cancelamento do período, a receita por dia, os agendamentos por status e
        a agenda do dia corrente (UC09, RN021). A quantidade, a taxa e os
        status usam a data marcada; a receita, a data de conclusão dos
        concluídos e reagendados. Sem as datas, vale o mês atual no fuso da
        empresa; o período vai até 366 dias contando as duas datas (RN035).
      security:
        - sessionCookie: []
      parameters:
        - name: from
          in: query
          description: Primeiro dia do período (aaaa-mm-dd); vem com `to`.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Último dia do período (aaaa-mm-dd); vem com `from`.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Dashboard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/dashboard/analysis:
    post:
      tags:
        - dashboard
      operationId: generateDashboardAnalysis
      summary: Análise do período por inteligência artificial
      description: >-
        Gera a análise do período por um serviço de inteligência artificial
        (UC27), que recebe só valores agregados (RN038) e cuja resposta é
        conferida antes de voltar (RN039); nada é gravado. O período anterior é
        o dos mesmos meses imediatamente anteriores, num período de meses
        inteiros, ou o da mesma quantidade de dias terminado na véspera; o
        período que termina depois do dia corrente é analisado até ele. Todo
        número da resposta é calculado pelo sistema. É POST porque é uma ação
        com custo, nunca repetida.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DashboardAnalysisInput"
      responses:
        "200":
          description: Análise do período.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardAnalysis"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "409":
          $ref: "#/components/responses/InsufficientData"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/AiUnavailable"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sb-<referência-do-projeto>-auth-token
      description: >-
        Sessão do Supabase Auth, gravada pelo servidor com @supabase/ssr. O
        valor pode vir dividido em pedaços (.0, .1). HttpOnly, Secure,
        SameSite=Lax e Path=/.
  headers:
    SessionCookies:
      description: >-
        Cookies da sessão, com HttpOnly, Secure, SameSite=Lax e Path=/; no
        encerramento, com Max-Age=0.
      schema:
        type: string
  schemas:
    Profile:
      type: string
      enum:
        - client
        - staff
        - admin
      description: Perfil da conta (guia/mapa.md); admin é o staff com is_admin.
    Permission:
      type: string
      enum:
        - dashboard
        - appointments
        - services
        - clients
        - staff
        - settings
      description: Uma permissão por página do painel, na ordem de RN025.
    RegisterInput:
      type: object
      required:
        - firstName
        - lastName
        - email
        - phone
        - password
      properties:
        firstName:
          type: string
          description: >-
            Nome no formato de RN035: de 2 a 60 letras, com espaço, hífen e
            apóstrofo; gravado com as iniciais maiúsculas e as partículas em
            minúsculas.
          examples:
            - maria
        lastName:
          type: string
          description: Sobrenome, no mesmo formato do nome.
          examples:
            - DA SILVA
        email:
          type: string
          format: email
          maxLength: 254
          description: Formato de RN035; gravado em minúsculas e sem espaços.
          examples:
            - maria@email.com
        phone:
          type: string
          description: >-
            Celular com DDD válido e nove dígitos, iniciado por 9 (RN035); a
            máscara é aceita e removida.
          examples:
            - (82) 99999-8888
        password:
          type: string
          minLength: 8
          description: >-
            RS003: de 8 a 72 caracteres, com o máximo contado em bytes UTF-8,
            ao menos uma letra maiúscula, um número e um caractere especial;
            gravada como digitada.
      description: >-
        Campos não previstos são descartados (RS013), inclusive a marca de
        troca de senha.
    RegisteredClient:
      type: object
      required:
        - firstName
        - lastName
        - email
        - phone
      properties:
        firstName:
          type: string
          examples:
            - Maria
        lastName:
          type: string
          examples:
            - da Silva
        email:
          type: string
          examples:
            - maria@email.com
        phone:
          type: string
          pattern: "^[0-9]{11}$"
          examples:
            - "82999998888"
      description: >-
        Dados gravados, já normalizados (RN035): os mesmos campos de GET
        /api/me/profile, sem o id, que vem sempre da sessão (RS009).
    ChangePasswordInput:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          description: >-
            Senha atual, que no primeiro acesso é a inicial; como digitada,
            até 72 bytes em UTF-8, sem as regras de composição do RS003.
        newPassword:
          type: string
          minLength: 8
          description: >-
            Formato de RS003, como digitada, e diferente da atual (RN023,
            RS004).
      description: Campos não previstos são descartados (RS013).
    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Formato de RN035; gravado em minúsculas e sem espaços.
          examples:
            - maria@email.com
        password:
          type: string
          minLength: 1
          description: >-
            Como digitada, até 72 bytes em UTF-8, sem as regras de composição
            do RS003.
      description: Campos não previstos são descartados (RS013).
    SessionUser:
      type: object
      required:
        - profile
        - firstName
        - lastName
        - mustChangePassword
        - permissions
      properties:
        profile:
          $ref: "#/components/schemas/Profile"
        firstName:
          type: string
          examples:
            - Ana
        lastName:
          type: string
          examples:
            - Souza
        mustChangePassword:
          type: boolean
          description: Senha inicial pendente de troca (RN023, RS004).
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
          description: >-
            Na ordem de RN025; todas para o admin (RN027) e nenhuma para o
            cliente ou para o funcionário de cargo inativo.
          examples:
            - - dashboard
              - appointments
    BusinessDay:
      type: object
      required:
        - weekday
        - isOpen
        - opensAt
        - closesAt
        - breakStartsAt
        - breakEndsAt
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: Dia da semana, de domingo (0) a sábado (6).
        isOpen:
          type: boolean
          description: Indica se a empresa funciona no dia.
        opensAt:
          type:
            - string
            - "null"
          pattern: "^([01][0-9]|2[0-3]):(00|30)$"
          description: >-
            Abertura em HH:MM, no fuso da empresa, sem data nem deslocamento;
            null no dia fechado.
          examples:
            - "08:00"
        closesAt:
          type:
            - string
            - "null"
          pattern: "^([01][0-9]|2[0-3]):(00|30)$"
          description: Encerramento em HH:MM; null no dia fechado.
          examples:
            - "18:00"
        breakStartsAt:
          type:
            - string
            - "null"
          pattern: "^([01][0-9]|2[0-3]):(00|30)$"
          description: Início da pausa em HH:MM (RN013); null sem pausa.
          examples:
            - "12:00"
        breakEndsAt:
          type:
            - string
            - "null"
          pattern: "^([01][0-9]|2[0-3]):(00|30)$"
          description: Fim da pausa em HH:MM; null sem pausa.
          examples:
            - "13:00"
    PublicCategory:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    PublicService:
      type: object
      required:
        - id
        - name
        - description
        - imageUrl
        - category
        - avgDurationMinutes
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        imageUrl:
          type:
            - string
            - "null"
          description: Endereço público da imagem no Storage (RS015), ou null.
        category:
          $ref: "#/components/schemas/PublicCategory"
        avgDurationMinutes:
          type: integer
    PublicServicePage:
      type: object
      required:
        - data
        - page
        - pageSize
        - total
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PublicService"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    PublicCompany:
      type: object
      required:
        - companyName
        - email
        - phone
        - whatsapp
        - address
        - instagramUrl
        - facebookUrl
        - businessHours
      properties:
        companyName:
          type: string
          maxLength: 100
          examples:
            - Glow – Estética Automotiva
        email:
          type:
            - string
            - "null"
          examples:
            - contato@glow.com
        phone:
          type:
            - string
