                $ref: "#/components/schemas/ClientAppointment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ClientForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidStatus"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/me/appointments/{id}/reschedule:
    post:
      tags:
        - client-area
      operationId: rescheduleMyAppointment
      summary: Reagenda um serviço concluído do cliente
      description: >-
        Cria um novo agendamento Agendado para o mesmo veículo e os mesmos
        serviços, pelo catálogo atual, e passa o original a Reagendado (UC25,
        RN020). Os serviços que o catálogo não oferece mais ficam de fora
        (RN008).
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentRescheduleInput"
      responses:
        "201":
          description: Novo agendamento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientAppointment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ClientForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidStatus"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/clients:
    get:
      tags:
        - clients
      operationId: listClients
      summary: Lista e busca clientes
      description: >-
        Clientes por nome completo, 20 por página, sem os excluídos (UC17,
        RF069, RN030, RNF008). A busca separa o termo em palavras, e cada uma
        precisa aparecer, sem diferenciar maiúsculas, no nome, no sobrenome,
        no e-mail ou no telefone (RF070).
      security:
        - sessionCookie: []
      parameters:
        - name: search
          in: query
          description: Até 100 caracteres; vazio não filtra.
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: Até 50; acima disso vale 50.
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: Página de clientes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - clients
      operationId: createClient
      summary: Cadastra um cliente
      description: >-
        Cria a conta do cliente e o perfil, com a troca da senha inicial
        pendente no primeiro acesso (UC16, RN023, RS004). A conta é removida se
        o perfil não for gravado.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Cliente criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminClient"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "409":
          description: >-
            EMAIL_IN_USE: o e-mail já tem conta, de cliente ou de funcionário
            (RN022, UC16 FE02).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/clients/{id}:
    get:
      tags:
        - clients
      operationId: getClient
      summary: Detalha um cliente
      description: >-
        Dados da conta do cliente (UC17, RF072). O cliente excluído e o id que
        não é UUID respondem o mesmo 404 do cliente inexistente.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: O cliente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminClient"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags:
        - clients
      operationId: updateClient
      summary: Edita os dados de um cliente
      description: >-
        Altera só os campos enviados, ao menos um (UC17, RF073); o e-mail não
        muda. A gravação só acontece se o cliente ainda tiver o updatedAt
        enviado (RNF011, decisão 0009).
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdateInput"
      responses:
        "200":
          description: Cliente atualizado, com o novo updatedAt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminClient"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags:
        - clients
      operationId: deleteClient
      summary: Exclui a conta de um cliente
      description: >-
        Exclusão lógica: o cliente deixa de ser listado, perde o acesso (a
        conta do Supabase Auth é removida e o e-mail fica livre), e os veículos
        e os agendamentos são preservados (UC17 FA01, RF074, RN030). Se a conta
        não puder ser removida, a exclusão é desfeita e o erro é 500.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Conta excluída.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/clients/{id}/vehicles:
    get:
      tags:
        - clients
      operationId: listClientVehicles
      summary: Lista os veículos de um cliente
      description: >-
        Veículos vinculados à conta, 10 por página, na ordem dos vínculos e,
        no empate, pelo identificador do veículo (UC17, UC18, RF076). O
        cliente excluído e o id que não é UUID respondem o mesmo 404 do
        cliente inexistente.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: Até 50; acima disso vale 50.
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        "200":
          description: Página de veículos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientVehiclePage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - clients
      operationId: addClientVehicle
      summary: Cadastra ou vincula um veículo à conta do cliente
      description: >-
        Com a placa já cadastrada, vincula o veículo existente sem alterá-lo e
        sem criar outro; os demais campos são ignorados (UC18 FA01, RN036).
        Com a placa nova, os cinco dados são obrigatórios; o veículo e o vínculo
        são gravados numa só transação, e o porte vem do tipo (RN002).
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleInput"
      responses:
        "201":
          description: Veículo cadastrado ou vinculado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientVehicle"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            VEHICLE_ALREADY_LINKED: o veículo já está na conta do cliente
            (RN036, UC18 FE02).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/vehicles/lookup:
    get:
      tags:
        - clients
      operationId: lookUpVehicle
      summary: Consulta uma placa
      description: >-
        Devolve o tipo, a marca, o modelo, a cor e o ano do veículo, se a placa
        já estiver cadastrada, ou null; nunca devolve dados de clientes (UC18,
        RN036). A placa vale com ou sem hífen, em qualquer caixa (RN035).
      security:
        - sessionCookie: []
      parameters:
        - name: plate
          in: query
          required: true
          schema:
            type: string
            examples:
              - ABC-1234
      responses:
        "200":
          description: O veículo da placa, ou null.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VehicleLookup"
                  - type: "null"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/vehicles/{id}:
    patch:
      tags:
        - clients
      operationId: updateVehicle
      summary: Edita um veículo
      description: >-
        Altera só os campos enviados, ao menos um, em todas as contas a que o
        veículo está vinculado (UC18 FA02, RF076, RN036). O porte é redefinido
        pelo tipo (RN002), e os agendamentos já registrados não mudam (RN037).
        A gravação só acontece se o veículo ainda tiver o updatedAt enviado
        (RNF011, decisão 0009).
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleUpdateInput"
      responses:
        "200":
          description: Veículo atualizado, com o novo updatedAt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientVehicle"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            PLATE_IN_USE: a placa pertence a outro veículo (RN036, UC18 FE03);
            ou VERSION_CONFLICT: o veículo foi alterado depois da leitura
            (RNF011).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/appointments:
    get:
      tags:
        - appointments
      operationId: listAdminAppointments
      summary: Lista os agendamentos de uma visão
      description: >-
        Agendamentos de hoje, futuros ou do histórico, 20 por página (UC10,
        RF044 a RF049, RNF008). Em today estão Agendado, Em espera, Em
        execução e Finalizado marcados para hoje, no fuso da empresa, ou para
        dias anteriores; em future, os mesmos status marcados para depois de
        hoje; em history, Concluído, Cancelado e Reagendado de qualquer data.
        Os dados vêm da cópia gravada no agendamento (RN037). Dois
        agendamentos no mesmo instante saem pelo identificador.
      security:
        - sessionCookie: []
      parameters:
        - name: view
          in: query
          required: true
          schema:
            type: string
            enum:
              - today
              - future
              - history
        - name: status
          in: query
          description: >-
            Um dos status da visão (RF046); outro status responde 400. Vazio
            não filtra.
          schema:
            $ref: "#/components/schemas/AppointmentStatus"
        - name: search
          in: query
          description: >-
            Até 100 caracteres; vazio não filtra. O termo se separa em
            palavras, e cada uma precisa aparecer, sem diferenciar maiúsculas,
            no nome do cliente, na placa (com ou sem hífen), na marca ou no
            modelo (RF047).
          schema:
            type: string
        - name: sort
          in: query
          description: >-
            time (padrão): pelo horário marcado, do mais próximo ao mais
            distante, e no history do mais recente ao mais antigo; status: na
            ordem de RN017 e, dentro de cada status, por time (RF045).
          schema:
            type: string
            enum:
              - time
              - status
            default: time
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: Até 50; acima disso vale 50.
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: Página de agendamentos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAppointmentPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - appointments
      operationId: createAdminAppointment
      summary: Registra um agendamento para um cliente
      description: >-
        Registra o agendamento com o status scheduled, a cópia dos dados do
        cliente, do veículo e dos serviços e os valores calculados pelo
        servidor, em uma transação (UC11, RN003, RN037, RNF010). Não há
        controle de capacidade: outro agendamento no mesmo horário é aceito
        (RN016).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Agendamento registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAppointment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/appointments/{id}:
    get:
      tags:
        - appointments
      operationId: getAdminAppointment
      summary: Detalha um agendamento
      description: >-
        O agendamento com os dados copiados nele (UC10, RN037). No status
        awaiting_payment, também o total de cada forma de pagamento, para a
        conclusão (RF053): a forma do agendamento mantém o percentual e o
        total gravados, e as outras usam o percentual vigente (RN012).
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Agendamento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAppointment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags:
        - appointments
      operationId: editAdminAppointment
      summary: Edita um agendamento
      description: >-
        Em qualquer status, sem mudar o status (UC26 FA01, RN032). Só o que
        vem é conferido, e o valor igual ao gravado não conta como mudança. A
        troca de veículo ou de serviços recalcula todos os itens pelo
        catálogo atual; a troca da forma aplica o percentual vigente; o que
        não mudou fica como gravado (RN033, RN037). A data e o horário só são
        conferidos quando mudam (RN033). updatedAt é a versão lida (RNF011).
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentEditInput"
      responses:
        "200":
          description: Agendamento atualizado, com o mesmo status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAppointment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/appointments/{id}/advance:
    post:
      tags:
        - appointments
      operationId: advanceAdminAppointment
      summary: Avança o status do agendamento
      description: >-
        Agendado, Em espera, Em execução e Finalizado, nesta ordem, sem
        confirmação (UC12, RN017). O status atual vai na mensagem da recusa.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Agendamento com o novo status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAppointment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidStatus"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/appointments/{id}/complete:
    post:
      tags:
        - appointments
      operationId: completeAdminAppointment
      summary: Conclui o atendimento
      description: >-
        Do Finalizado ao Concluído, com a forma de pagamento usada (UC12 FA01,
        RN018). A forma do agendamento mantém o percentual e o total gravados;
        outra forma usa o percentual vigente sobre o subtotal (RN012).
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentCompleteInput"
      responses:
        "200":
          description: Agendamento concluído.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAppointment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidStatus"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/appointments/{id}/cancel:
    post:
      tags:
        - appointments
      operationId: cancelAdminAppointment
      summary: Cancela o agendamento
      description: >-
        Só do Agendado e do Em espera (UC12 FA02, RN019).
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Agendamento cancelado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAppointment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidStatus"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/appointments/{id}/reschedule:
    post:
      tags:
        - appointments
      operationId: rescheduleAdminAppointment
      summary: Reagenda um serviço concluído
      description: >-
        Cria um novo agendamento Agendado para o mesmo veículo e os mesmos
        serviços, pelo catálogo atual, e passa o original a Reagendado (UC25
        FA01, RN020). Os serviços que o catálogo não oferece mais ficam de
        fora (RN008).
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
