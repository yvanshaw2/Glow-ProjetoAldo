      summary: Calcula os valores de um agendamento do cliente, sem gravar
      description: >-
        Pelo catálogo vigente: os serviços que podem ser agendados ficam, os
        outros saem. A data, o horário e a composição só são conferidos no
        registro. appointmentId identifica a edição e não muda o cálculo (UC06
        passos 6, 8 e 11, RN010, RN012, RN014, RN034). O veículo que não está
        na conta do cliente responde 404 (RS009).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentPreviewInput"
      responses:
        "200":
          description: Valores calculados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentPreview"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ClientForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/me/appointments:
    get:
      tags:
        - client-area
      operationId: listMyAppointments
      summary: Lista os agendamentos do cliente da sessão
      description: >-
        Só os agendamentos do cliente (UC07, RF028, RF029, RS009), com os
        dados copiados neles (RN037), 10 por página. O escopo current traz
        Agendado, Em espera, Em execução e Finalizado, da data mais próxima à
        mais distante; o history traz Concluído, Cancelado e Reagendado, da
        data mais recente à mais antiga. O identificador desempata.
      security:
        - sessionCookie: []
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum:
              - current
              - history
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: Até 50; acima disso vale 50.
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        "200":
          description: Página de agendamentos do cliente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientAppointmentPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ClientForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - client-area
      operationId: createMyAppointment
      summary: Agenda um serviço para o cliente da sessão
      description: >-
        O cliente é o da sessão, e o veículo precisa ser da conta dele (UC06,
        RN003, RS009). O servidor calcula os valores pelo catálogo vigente,
        confere a composição e a data (RN005, RN006, RN013, RN015) e grava o
        agendamento scheduled, a cópia dos dados e os serviços numa transação
        (RN037, RNF010). Não há controle de capacidade (RN016).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MyAppointmentInput"
      responses:
        "201":
          description: Agendamento registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientAppointment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ClientForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/me/appointments/{id}:
    get:
      tags:
        - client-area
      operationId: getMyAppointment
      summary: Detalha um agendamento do cliente
      description: >-
        O agendamento com os dados copiados nele (UC07, RN037). O de outro
        cliente responde 404, como o que não existe (RS009).
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Agendamento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientAppointment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ClientForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags:
        - client-area
      operationId: editMyAppointment
      summary: Edita um agendamento Agendado do cliente
      description: >-
        Só no status Agendado, sem mudar o status (UC26, RN032). Só o que vem
        é conferido, e o valor igual ao gravado não conta como mudança. A
        troca de veículo ou de serviços recalcula todos os itens pelo
        catálogo atual; a troca da forma aplica o percentual vigente; a nova
        data não pode ser anterior à marcada (RN033, RN037). O veículo que
        não está na conta responde 404 (RS009). updatedAt é a versão lida
        (RNF011).
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentEditInput"
      responses:
        "200":
          description: Agendamento atualizado, com o mesmo status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientAppointment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ClientForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/me/appointments/{id}/cancel:
    post:
      tags:
        - client-area
      operationId: cancelMyAppointment
      summary: Cancela um agendamento Agendado do cliente
      description: >-
        Só do Agendado (UC07 FA01, RN019). Em outro status, 409
        INVALID_STATUS com o status na mensagem.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Agendamento cancelado.
          content:
            application/json:
