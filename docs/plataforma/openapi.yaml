        fica livre e os agendamentos que o têm são preservados. Excluir de novo
        responde 404.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Serviço excluído.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
