      description: "FORBIDDEN: origem recusada (RS014)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PayloadTooLarge:
      description: >-
        PAYLOAD_TOO_LARGE: corpo acima de 100 KB, ou imagem acima de 2 MB na
        rota de envio.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    UnsupportedMediaType:
      description: "UNSUPPORTED_MEDIA_TYPE: corpo fora de application/json."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    InternalError:
      description: >-
        INTERNAL_ERROR: falha inesperada; o detalhe fica só no registro, pelo
        requestId (RS017).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    InsufficientData:
      description: >-
        INSUFFICIENT_DATA: o período analisado não tem agendamentos, e o serviço
        de IA não foi chamado (UC27 FE01).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    AiUnavailable:
      description: >-
        AI_UNAVAILABLE: o serviço de IA não está configurado, não respondeu em
        15 segundos, recusou pelo limite de uso ou devolveu resposta fora de
        RN039; o motivo vai só ao registro (UC27 FE02).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ServiceUnavailable:
      description: "SERVICE_UNAVAILABLE: o Supabase Auth não atendeu."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unauthenticated:
      description: >-
        UNAUTHENTICATED: sem sessão, sessão expirada ou encerrada, ou conta
        excluída ou sem perfil.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ClientForbidden:
      description: >-
        FORBIDDEN: a sessão não é de cliente (RS009) ou, nas gravações, origem
        recusada (RS014). PASSWORD_CHANGE_REQUIRED: senha inicial pendente de
        troca (RS004).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PanelForbidden:
      description: >-
        FORBIDDEN: cliente ou funcionário sem a permissão da página (RS008,
        RS010) ou, nas gravações, origem recusada (RS014). ACCOUNT_INACTIVE:
        funcionário desativado (RN026). PASSWORD_CHANGE_REQUIRED: senha inicial
        pendente de troca (RS004).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    VersionConflict:
      description: >-
        VERSION_CONFLICT: o registro mudou depois da leitura, e nada foi
        gravado (RNF011).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    InvalidStatus:
      description: >-
        INVALID_STATUS: a ação não é permitida no status atual do agendamento,
        que vai na mensagem, e nada foi gravado (RN017).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: "NOT_FOUND: o registro não existe, ou o id não é um UUID."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NameInUse:
      description: >-
        NAME_IN_USE: já existe um cadastro com este nome, sem diferenciar
        maiúsculas (RN035).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
